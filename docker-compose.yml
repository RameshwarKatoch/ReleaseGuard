services:
  db:
    image: postgres:16
    container_name: releaseguard-db
    environment:
      POSTGRES_USER: releaseguard
      POSTGRES_PASSWORD: releaseguard
      POSTGRES_DB: orderflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U releaseguard -d orderflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: releaseguard-app
    environment:
      DATABASE_URL: postgresql://releaseguard:releaseguard@db:5432/orderflow
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: